<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Login - Engineering Student Hub">
  <title>Student Login - Engineering Student Hub</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>StudentHub</span>
      </a>
      <h2>Welcome Back</h2>
      <p>Sign in to access your study resources and projects</p>
    </div>

    <form class="login-form" onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="username">Username or Student ID</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="#">Request Access</a></p>
      <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
